version: "2"

run:
  timeout: 30m
  concurrency: 1
  go: "1.26.4"

linters:
  default: standard
  enable:
    - errname
    - errorlint
    - nilerr
    - exhaustive
    - gocritic
    - revive
    - misspell
    - nakedret
    - whitespace
    - prealloc
    - bodyclose
    - noctx
    - gosec
    - nolintlint

  settings:
    exhaustive:
      default-signifies-exhaustive: true

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam
        - rangeValCopy

    revive:
      rules:
        - name: if-return
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code

    nakedret:
      max-func-lines: 30

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - bodyclose
          - errname
          - revive
      - path: ^(internal/intltest|tools/conformance|tools/sizecheck)/
        text: G304
        linters:
          - gosec
      - path: ^tools/sizecheck/main\.go
        text: G204
        linters:
          - gosec
      # Domain decode.go layers narrow uvarint streams back into the bounded
      # types the generator wrote (locale handles into uint16, durations and
      # rounding magnitudes into int). The codec trust contract guarantees these
      # values fit by construction and the round-trip gate proves it, so the
      # G115 overflow conversions here are safe by design.
      - path: ^internal/cldr/[^/]+/decode\.go$
        text: G115
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/agentable/go-intl

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
