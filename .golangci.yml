version: "2"

run:
  timeout: 30m
  concurrency: 1
  go: "1.26.3"
  tests: true
  relative-path-mode: gomod

linters:
  default: standard
  enable:
    - copyloopvar
    - dogsled
    - err113
    - errorlint
    - exhaustive
    - gocritic
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - promlinter
    - revive
    - unconvert
    - whitespace
  settings:
    dogsled:
      max-blank-identifiers: 3
    revive:
      rules:
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: strict
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      - linters:
          - funlen
          - gochecknoglobals
          - gosec
          - noctx
          - revive
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/agentable/go-intl
  exclusions:
    generated: strict
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  sort-order:
    - linter
    - severity
    - file
  show-stats: true
