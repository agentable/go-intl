version: '3'

vars:
  PROJECT_ROOT:
    sh: pwd
  GOBIN: '{{.PROJECT_ROOT}}/bin'
  GOLANGCI_LINT_LOCAL_BINARY: '{{.GOBIN}}/golangci-lint'
  REQUIRED_GOLANGCI_LINT_VERSION:
    sh: cat .golangci.version 2>/dev/null || echo "2.12.2"
  GOLANGCI_LINT_BINARY:
    sh: |
      required="$(cat .golangci.version 2>/dev/null || echo "2.12.2")"
      for candidate in "$(command -v golangci-lint 2>/dev/null || true)" "{{.GOLANGCI_LINT_LOCAL_BINARY}}"; do
        [ -n "$candidate" ] || continue
        [ -x "$candidate" ] || continue
        version="$("$candidate" version --format short 2>/dev/null || "$candidate" version --short 2>/dev/null || true)"
        if [ "$version" = "$required" ]; then
          echo "$candidate"
          exit 0
        fi
      done
      echo "{{.GOLANGCI_LINT_LOCAL_BINARY}}"
  GOLANGCI_LINT_VERSION:
    sh: |
      {{.GOLANGCI_LINT_BINARY}} version --format short 2>/dev/null ||
      {{.GOLANGCI_LINT_BINARY}} version --short 2>/dev/null ||
      echo "not-installed"
  REQUIRED_BENCHSTAT_VERSION: v0.0.0-20260615155930-9e4b9ddef5b6
  BENCHSTAT_VERSION_MARKER: .tmp/benchstat.version

env:
  GOBIN: '{{.GOBIN}}'

tasks:
  default:
    desc: Run lint and test
    cmds:
      - task: lint
      - task: test

  help:
    desc: Show this help message
    cmds:
      - echo "go-intl"
      - echo "Available targets:"
      - task --list
    silent: true

  clean:
    desc: Clean build artifacts and caches
    cmds:
      - echo "Cleaning build artifacts..."
      - rm -rf {{.GOBIN}}
      - go clean -cache -testcache || true

  codegraph:source:
    desc: Build a source-only CodeGraph mirror that excludes .references
    cmds:
      - scripts/codegraph-source.sh init

  codegraph:source:status:
    desc: Show source-only CodeGraph mirror status
    cmds:
      - scripts/codegraph-source.sh status

  codegraph:source:sync-check:
    desc: Verify source-only CodeGraph mirror matches the current worktree
    cmds:
      - scripts/codegraph-source.sh sync-check

  codegraph:source:clean:
    desc: Remove the source-only CodeGraph mirror
    cmds:
      - scripts/codegraph-source.sh clean

  deps:
    desc: Download Go module dependencies
    cmds:
      - echo "Downloading dependencies..."
      - go mod download
      - go mod tidy


  deps:update:
    desc: Update dependencies for the root module and any nested modules
    cmds:
      - |
        set -e
        echo "Updating dependencies..."
        MODULES=". $(find . -mindepth 2 -name go.mod \
          -not -path '*/vendor/*' -not -path '*/.*' \
          -exec dirname {} \; | sort)"
        for dir in $MODULES; do
          echo "==> $dir"
          (
            cd "$dir"
            replaced=$(awk '
              /^replace[[:space:]]+[^(]/ { print $2 }
              /^replace[[:space:]]*\(/ { f=1; next }
              f && /^\)/ { f=0; next }
              f && /=>/ { print $1 }
            ' go.mod)
            deps=$(awk '
              /^require[[:space:]]+[^(]/ { print $2 }
              /^require[[:space:]]*\(/ { f=1; next }
              f && /^\)/ { f=0; next }
              f && !/\/\/ indirect/ && NF >= 2 { print $1 }
            ' go.mod | while read -r dep; do
              echo "$replaced" | grep -qxF "$dep" || echo "$dep"
            done | tr '\n' ' ')
            if [ -n "$deps" ]; then
              go get -u $deps
            fi
            go mod tidy
          )
        done
        if [ -f go.work ]; then
          echo "==> go work sync"
          go work sync
        fi


  submodule:update:
    desc: Init/reset nested git submodules for this repository
    cmds:
      - |
        set -eu
        if [ ! -f .gitmodules ]; then
          echo "No nested submodules."
          exit 0
        fi
        git submodule sync --recursive
        git submodule update --init --recursive --remote --force
        git submodule foreach --recursive 'git reset --hard && git clean -fd' || true
        git submodule sync --recursive
        git submodule update --init --recursive --remote --force
  test:
    desc: Run all tests with race detection
    cmds:
      - echo "Running all tests..."
      - go test -race -p 1 ./...

  lint:
    desc: Run all linters
    deps:
      - golangci-lint
      - tidy-lint

  install-golangci-lint:
    desc: Install golangci-lint with the required version
    cmds:
      - mkdir -p "{{.GOBIN}}"
      - |
        if [ "{{.GOLANGCI_LINT_VERSION}}" != "{{.REQUIRED_GOLANGCI_LINT_VERSION}}" ]; then
          echo "Installing golangci-lint v{{.REQUIRED_GOLANGCI_LINT_VERSION}}..."
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "{{.GOBIN}}" v{{.REQUIRED_GOLANGCI_LINT_VERSION}}
          echo "golangci-lint v{{.REQUIRED_GOLANGCI_LINT_VERSION}} installed successfully"
        fi
    status:
      - test "{{.GOLANGCI_LINT_VERSION}}" = "{{.REQUIRED_GOLANGCI_LINT_VERSION}}"

  golangci-lint:
    desc: Run golangci-lint
    deps:
      - install-golangci-lint
    cmds:
      - '{{.GOLANGCI_LINT_BINARY}} version'
      - echo "Running golangci-lint..."
      - '{{.GOLANGCI_LINT_BINARY}} run --timeout=30m --concurrency=1 --path-prefix=.'

  tidy-lint:
    desc: Check if go.mod and go.sum are tidy
    cmds:
      - echo "Checking go.mod and go.sum are tidy..."
      - go mod tidy
      - git diff --exit-code -- go.mod go.sum

  yamllint:
    desc: Run yamllint
    cmds:
      - yamllint -s .

  vuln:
    desc: Run govulncheck
    cmds:
      - |
        GOBIN=$(go env GOBIN)
        if [ -z "$GOBIN" ]; then
          GOBIN="$(go env GOPATH)/bin"
        fi
        GOVULNCHECK="$GOBIN/govulncheck"
        if [ ! -x "$GOVULNCHECK" ]; then
          go install golang.org/x/vuln/cmd/govulncheck@latest
        fi
        "$GOVULNCHECK" ./...

  data:preflight:
    desc: Verify CLDR, IANA identity, and Go transition-data pins are compatible
    internal: true
    cmds:
      - go run ./tools/data-preflight

  data:fetch:cldr:
    desc: Install pinned cldr-json source via npm ci
    internal: true
    deps:
      - data:preflight
    cmds:
      - npm ci --prefix tools/gen-cldr/.cldr-json --silent --no-audit --no-fund
    sources:
      - tools/gen-cldr/.cldr-json/package.json
      - tools/gen-cldr/.cldr-json/package-lock.json
    generates:
      - tools/gen-cldr/.cldr-json/node_modules/.package-lock.json

  data:fetch:tzdb:
    desc: Fetch and verify the pinned IANA tzdb source archive
    internal: true
    deps:
      - data:preflight
    cmds:
      - |
        set -eu
        LOCK=tools/gen-cldr/tzdata.json
        VERSION=$(sed -n -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' "$LOCK")
        URL=$(sed -n -E 's/.*"url"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' "$LOCK")
        WANT=$(sed -n -E 's/.*"sha256"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' "$LOCK")
        CACHE=tools/gen-cldr/.tzdata/tzdata${VERSION}.tar.gz
        mkdir -p "$(dirname "$CACHE")"
        if [ -f "$CACHE" ] && [ "$(shasum -a 256 "$CACHE" | awk '{print $1}')" = "$WANT" ]; then
          exit 0
        fi
        TMP=${CACHE}.tmp
        rm -f "$TMP"
        curl -fsSL "$URL" -o "$TMP"
        GOT=$(shasum -a 256 "$TMP" | awk '{print $1}')
        if [ "$GOT" != "$WANT" ]; then
          rm -f "$TMP"
          printf 'ERROR: tzdb archive sha256 %s, want %s\n' "$GOT" "$WANT" >&2
          exit 1
        fi
        mv "$TMP" "$CACHE"

  data:fetch:
    desc: Fetch all pinned CLDR and IANA generation inputs
    internal: true
    deps:
      - data:fetch:cldr
      - data:fetch:tzdb

  data:
    desc: Regenerate internal/cldr/ from the pinned cldr-json source
    deps:
      - data:fetch
    cmds:
      - >-
        go -C tools/gen-cldr run .
        -cldr-dir .cldr-json/node_modules
        -out ../../internal/cldr
        -version-file ../../internal/cldr/VERSION
        -profile ../locale-profile.json
        -localeid-out ../../internal/localeid/unicode_alias_data.go
        -localematcher-out ../../internal/localematcher/profile_data.go
        -tzdata-lock tzdata.json
        -timezone-out ../../internal/tz/registry_data.go
      - >-
        go -C tools/gen-plural-rules run .
        -plurals ../gen-cldr/.cldr-json/node_modules/cldr-core/supplemental/plurals.json
        -ranges ../gen-cldr/.cldr-json/node_modules/cldr-core/supplemental/pluralRanges.json
        -out ../../internal/cldr/plural
        -profile ../locale-profile.json
      - task: data:contract
      - |
        echo ""
        echo "Next:"
        echo "  git diff internal/cldr/   # review the regenerated data"
        echo "  task verify               # run the full gate before committing"

  data:check:
    desc: Verify internal/cldr/ is byte-identical to a fresh regeneration (CI gate)
    deps:
      - data:fetch
    cmds:
      - rm -rf .tmp/generated
      - mkdir -p .tmp/generated/internal/cldr
      - >-
        go -C tools/gen-cldr run .
        -cldr-dir .cldr-json/node_modules
        -out ../../.tmp/generated/internal/cldr
        -version-file ../../internal/cldr/VERSION
        -profile ../locale-profile.json
        -localeid-out ../../.tmp/generated/internal/localeid/unicode_alias_data.go
        -localematcher-out ../../.tmp/generated/internal/localematcher/profile_data.go
        -tzdata-lock tzdata.json
        -timezone-out ../../.tmp/generated/internal/tz/registry_data.go
      - >-
        go -C tools/gen-plural-rules run .
        -plurals ../gen-cldr/.cldr-json/node_modules/cldr-core/supplemental/plurals.json
        -ranges ../gen-cldr/.cldr-json/node_modules/cldr-core/supplemental/pluralRanges.json
        -out ../../.tmp/generated/internal/cldr/plural
        -profile ../locale-profile.json
      - >-
        go run ./tools/check-generated-data
        -committed internal
        -generated .tmp/generated/internal
      - task: data:contract

  data:contract:
    desc: Verify generated CLDR data contracts without regeneration
    cmds:
      - go test -run 'Test(CLDRGeneratedDataContract|ManifestMatchesLocaleProfile|DefaultDataProfilePolicy|CLDRBackedSupportedLocalesReflectProfile|GeneratedDataShape|CLDRImportGraphDirection|NoImportOfRetiredRootCLDR|RetiredRootCLDRHasNoGoFiles)$' ./internal/cldr/locale
      - go test -run 'Test(SupportedCodesDoesNotDecodeOtherBlobs|NarrowIndexDoesNotDecodeMainBlobs|SupportedCalendarsReturnsCopy|SupportedLocalesDoesNotDecode(NameBlobs|PatternBlob|NumberBlob|FieldBlob|PatternBlobs)|GeneratedNumberingSystemExtrasHaveRuntimePayload|RuntimeNumberingSystemPayloadsAreAdvertised)$' ./internal/cldr/currency ./internal/cldr/date ./internal/cldr/displaynames ./internal/cldr/list ./internal/cldr/number ./internal/cldr/relativetime ./internal/cldr/timezone ./internal/cldr/unit
      - go test ./internal/cldr/plural
      - go test ./internal/numbering
      - go test ./internal/localeid
      - go test ./internal/localematcher
      - go test -run 'Test(SupportedLocalesReturnsCopy|SupportedCollationsReturnsCopy)$' ./internal/collation
      - go test -run 'TestSupportedLocales(ExcludesTailoredLocales|ReturnsSnapshot)$' ./internal/segmentation
      - go -C tools/gen-plural-rules test ./...

  build:size:
    desc: Report direct formatter, root facade, and CLDR binary size deltas
    cmds:
      - go run ./tools/sizecheck

  build:size:cold:
    desc: Report binary size deltas and compile time after clearing the Go build cache
    cmds:
      - go run ./tools/sizecheck -cold

  benchstat:
    desc: Install benchstat CLI
    cmds:
      - mkdir -p {{.GOBIN}} .tmp
      - go install golang.org/x/perf/cmd/benchstat@{{.REQUIRED_BENCHSTAT_VERSION}}
      - printf '%s\n' '{{.REQUIRED_BENCHSTAT_VERSION}}' > {{.BENCHSTAT_VERSION_MARKER}}
    status:
      - test -x {{.GOBIN}}/benchstat
      - test "$(cat {{.BENCHSTAT_VERSION_MARKER}} 2>/dev/null)" = "{{.REQUIRED_BENCHSTAT_VERSION}}"

  bench:run:
    desc: Run benchmarks once with allocation reporting
    cmds:
      - go test -race -run '^$' -bench=. -benchmem ./...

  bench:
    desc: Run non-blocking benchmark telemetry with benchstat-compatible output
    deps:
      - benchstat
    cmds:
      - mkdir -p .tmp
      - |
        {
          echo "go: $(go version)"
          echo "goarch: $(go env GOARCH)"
          sysctl -n machdep.cpu.brand_string 2>/dev/null || true
        } > .tmp/bench-current.txt
      - >-
        go test -run '^$' -bench=. -benchmem -count=5
        ./...
        >> .tmp/bench-current.txt
      - |
        if [ -n "${BASELINE:-}" ]; then
          {{.GOBIN}}/benchstat "$BASELINE" .tmp/bench-current.txt
        else
          cat .tmp/bench-current.txt
        fi

  fmt:
    desc: Format Go code
    deps:
      - install-golangci-lint
    cmds:
      - echo "Formatting Go code..."
      - '{{.GOLANGCI_LINT_BINARY}} fmt ./...'

  vet:
    desc: Run go vet
    cmds:
      - echo "Running go vet..."
      - go vet ./...

  conformance:verify:
    desc: Validate conformance fixtures, skip-list, coverage, Node witness matrix, and divergence audit
    cmds:
      - >-
        go run ./tools/check-conformance
        -skip-list .skip-list.json
        -coverage
        -node-witness
        ./locale ./numberformat ./datetimeformat ./pluralrules ./listformat ./relativetimeformat ./durationformat ./displaynames ./collator ./segmenter

  conformance:witness:
    desc: Refresh generated Node Intl witness fixtures with the active node binary
    cmds:
      - |
        node_path="$(command -v node)"
        if [ -z "$node_path" ]; then
          echo "ERROR: conformance:witness requires node on PATH" >&2
          exit 1
        fi
        go run ./tools/node-witness -node "$node_path" >/dev/null
        (cd tools/gen-fixtures-from-formatjs && go run . -node "$node_path" -out ../..)
      - |
        echo ""
        echo "Node witness diff:"
        git diff -- '*/testdata/conformance/node-v*/' testdata/native/
        echo ""
        echo "Next:"
        echo "  task conformance:verify"

  verify:
    desc: Run all verification steps (deps, format, vet, lint, test, conformance, data contract, vuln)
    cmds:
      - task: deps
      - task: fmt
      - task: vet
      - task: lint
      - task: test
      - task: conformance:verify
      - task: data:contract
      - task: vuln
      - echo "All verification steps completed successfully ✅"
